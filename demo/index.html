  <body>
    <main id="demo">
      <noscript>
        <h1>Slitscan</h1>
        <p>
          An FFGL effect that does slit-scan photography to your clip, once a
          frame: the phone filter that gives everyone a three-foot chin,
          Trumbull's Stargate corridor from 2001, the Doctor Who title tunnel
          and the Star Trek warp stretch. None of it's drawn. Each is one long
          exposure taken while something moves, and the perspective, the lean
          and the glow at the far end are what a slit, a dolly and an open
          shutter give you.
        </p>
        <p>
          This demo runs the plugin's shaders and a port of its CPU half in your
          browser, so it needs JavaScript and WebGL2. The plugin itself, its
          source and its downloads are on
          <a href="https://github.com/stoatworks-labs/slitscan">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/slitscan/">Project page and downloads</a></li>

          <li><a href="https://github.com/stoatworks-labs/slitscan">Source on GitHub</a></li>
        </ul>
      </noscript>
